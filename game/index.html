<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Keeper · 守灯人拾光</title>
<style>
  html, body { margin: 0; height: 100%; background: #04141b; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* The canvas is 960x540 inside; CSS scales it to fit while keeping 16:9. */
  #game { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Lantern Keeper: move along the seawall to catch fireflies and charge the lighthouse to 100 percent, while dodging falling shadow blocks"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
